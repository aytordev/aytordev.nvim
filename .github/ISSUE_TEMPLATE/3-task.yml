name: Technical Task
description: Propose maintenance, refactoring, or infrastructure work
labels: ["type:task"]
body:
  - type: textarea
    id: work
    attributes:
      label: Work required
      description: Describe the concrete technical change.
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: Explain the risk, debt, or workflow this addresses.
    validations:
      required: true

  - type: checkboxes
    id: affected-areas
    attributes:
      label: Affected areas
      options:
        - label: Flake or package API
        - label: Home Manager integration
        - label: Editor options or keymaps
        - label: Plugins or UI
        - label: Languages, LSP, or formatting
        - label: CI or documentation

  - type: textarea
    id: completion
    attributes:
      label: Completion criteria
      description: List the checks or observable outcomes required to close the task.
      placeholder: |
        - [ ] Implementation is complete
        - [ ] Relevant checks pass
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add related issues, upstream references, or constraints.
