name: Feature Request
description: Propose a new editor capability or improvement
labels: ["type:feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow or limitation should be improved?
      placeholder: Describe the current behavior and why it is insufficient.
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the behavior you want, not only a specific implementation.
    validations:
      required: true

  - type: checkboxes
    id: affected-areas
    attributes:
      label: Affected areas
      options:
        - label: Flake or package API
        - label: Home Manager integration
        - label: Editor options or keymaps
        - label: Plugins or UI
        - label: Languages, LSP, or formatting
        - label: CI or documentation

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: List observable conditions that would make the feature complete.
      placeholder: |
        - [ ] Expected behavior is available
        - [ ] Relevant checks cover the change
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Existing plugins, configuration, or workarounds you evaluated.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add links, screenshots, or related issues.
