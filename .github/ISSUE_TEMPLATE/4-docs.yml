name: Documentation
description: Report missing, incorrect, or unclear documentation
labels: ["type:docs"]
body:
  - type: input
    id: location
    attributes:
      label: Location
      description: Link or name the affected document and section.
      placeholder: README.md, Configuration Reference, or CONTRIBUTING.md
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Documentation problem
      description: Explain what is missing, incorrect, or difficult to understand.
    validations:
      required: true

  - type: textarea
    id: proposed-change
    attributes:
      label: Proposed improvement
      description: Describe the information or example that should be added.

  - type: input
    id: related-issues
    attributes:
      label: Related issues
      placeholder: "#42"
