name: Bug Report
description: Report reproducible unexpected behavior
labels: ["type:bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Describe the failure and its impact.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest sequence that consistently reproduces the issue.
      placeholder: |
        1. Run `nix run github:aytordev/aytordev.nvim`
        2. Open ...
        3. Execute ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead?
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include enough information to reproduce the same Nix and Neovim environment.
      placeholder: |
        - System: aarch64-darwin
        - Nix: `nix --version`
        - Installation: `nix run`, package, or Home Manager module
        - Revision: commit or flake.lock revision
        - Neovim: `nvim --version`
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Low
        - Medium
        - High
        - Critical
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs and health output
      description: Paste relevant errors, `:messages`, or focused `:checkhealth` output.
      render: text
