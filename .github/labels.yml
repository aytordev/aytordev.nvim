- name: "scope:flake"
  color: "C2E0C6"
  description: "Flake inputs, outputs, and package wiring"

- name: "scope:home-manager"
  color: "C2E0C6"
  description: "Home Manager module and public options"

- name: "scope:editor"
  color: "C2E0C6"
  description: "Core editor options and keymaps"

- name: "scope:plugins"
  color: "C2E0C6"
  description: "Plugin configuration under modules/nvf/plugins"

- name: "scope:languages"
  color: "C2E0C6"
  description: "Language modules, formatters, and diagnostics"

- name: "scope:lsp"
  color: "C2E0C6"
  description: "LSP servers and client behavior"

- name: "scope:ci"
  color: "C2E0C6"
  description: "GitHub Actions and project checks"

- name: "scope:docs"
  color: "C2E0C6"
  description: "Documentation and collaboration templates"

# Status and automation
- name: "status:needs-review"
  color: "FBCA04"
  description: "Awaiting maintainer review"

- name: "status:approved"
  color: "0E8A16"
