# Label reference for aytordev/aytordev.nvim. This file is not auto-synced.

# Type
- name: "type:feature"
  color: "5EBFCC"
  description: "New capability or enhancement"

- name: "type:bug"
  color: "D73A4A"
  description: "Unexpected behavior"

- name: "type:task"
  color: "7057FF"
  description: "Maintenance, refactoring, or infrastructure work"

- name: "type:docs"
  color: "0075CA"
  description: "Documentation improvement"

- name: "type:question"
  color: "D876E3"
  description: "Installation, configuration, or usage question"

